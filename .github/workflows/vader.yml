name: Vader
on: [push, pull_request]
jobs:
  vader:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Install Vim
      run: sudo apt-get update && sudo apt-get install -y vim
    - name: Review version
      run: vim --version
    - name: Run test suite
      run: make test
